name: Public repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    env:
      UV_PROJECT_ENVIRONMENT: /tmp/trace-evidence-venv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Public-tree audit
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m tools.audit_public_tree .
      - name: Install locked environment tool
        run: python -m pip install uv==0.12.0
      - name: Sync locked test environment
        run: uv sync --frozen --extra test
      - name: Lint
        run: uv run --frozen python -m ruff check .
      - name: Type check
        run: uv run --frozen python -m mypy src/trace_evidence examples
      - name: Unit tests and coverage
        run: uv run --frozen python -m pytest --cov=trace_evidence --cov-report=term-missing --cov-fail-under=80
      - name: Build package
        run: uv run --frozen python -m build
      - name: Compile optional examples
        run: uv run --frozen python -m compileall -q src pipeline tools examples
