[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-evidence"
version = "0.1.0"
description = "Curated pipeline and release-assurance components from TRACE"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "requests>=2.31",
]

[project.optional-dependencies]
test = [
    "build>=1.2,<2",
    "mypy>=1.11,<2",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
]
api = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn>=0.27",
]
training = [
    "bertopic>=0.16",
    "hdbscan>=0.8.33",
    "sentence-transformers>=3",
    "scikit-learn>=1.4",
    "umap-learn>=0.5.5",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["trace_evidence*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["trace_evidence"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "def main\\(\\) -> None:",
    "def _selftest\\(\\) -> None:",
    "if __name__ == [\"']__main__[\"']:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
